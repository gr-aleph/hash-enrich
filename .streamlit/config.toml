# Read automatically when Streamlit is started from the project folder.

[server]
# Only this laptop can open the page. The page calls the backend with your API key,
# so a page open to the network would let others use your quota. See design.md.
address = "127.0.0.1"
port = 8501

[browser]
gatherUsageStats = false

[client]
# Hide Streamlit's developer toolbar (e.g. the "Deploy" button).
toolbarMode = "viewer"

# Dark "SOC console" look: navy background, cyan accent.
[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#111a2e"
textColor = "#e2e8f0"
font = "sans serif"
